openapi: 3.1.0
info:
  title: YL Cloud Open API
  version: 1.0.0
  description: Stable API Key authenticated contract. Production clients should pin /api/v1.
servers:
  - url: /api/v1
security:
  - bearerApiKey: []
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200': {description: Effective key snapshot}
  /files:
    get:
      operationId: listFiles
      parameters:
        - {name: parentId, in: query, schema: {type: integer, format: int64}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Paginated files}
  /files/upload:
    post:
      operationId: uploadFile
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, parentId]
              properties:
                file: {type: string, format: binary}
                parentId: {type: integer, format: int64}
      responses:
        '200': {description: File uploaded or idempotently replayed}
        '413': {$ref: '#/components/responses/Error'}
  /files/folders:
    post:
      operationId: createFolder
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Folder created or replayed}
  /files/{fileId}/move:
    put:
      operationId: moveFile
      parameters:
        - {name: fileId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: File moved inside key boundary}
  /files/{fileId}:
    delete:
      operationId: moveFileToRecycleBin
      parameters:
        - {name: fileId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Recoverable delete accepted}
  /spaces:
    get:
      operationId: listScopedSpaces
      responses:
        '200': {description: Current permissions intersected with creation snapshot}
  /spaces/{spaceId}/knowledge/query:
    post:
      operationId: queryKnowledge
      parameters:
        - {name: spaceId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Grounded answer}
  /assistant/sessions:
    post:
      operationId: createAssistantSession
      responses:
        '200': {description: Session created}
  /assistant/sessions/{sessionId}/queries:
    post:
      operationId: submitAssistantQuery
      description: Idempotent replay rechecks every Space in the stored original request against the current API Key. Replacing spaceIds in the new body cannot narrow that authorization check.
      parameters:
        - {$ref: '#/components/parameters/ChatIdempotencyKey'}
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Query accepted or replayed}
        '403': {$ref: '#/components/responses/Error'}
  /assistant/sessions/{sessionId}/queries/{messageId}:
    get:
      operationId: getAssistantQueryResult
      description: Read one owned task after checking the current key scope and membership for every original Space. Current evidence and revision permissions are revalidated; inaccessible answer content is withheld. Original Agent tasks still require KNOWLEDGE_AGENT through this route.
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: messageId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {$ref: '#/components/responses/ChatQueryResult'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /agent/sessions/{sessionId}/queries:
    post:
      operationId: submitAgentQuery
      description: Requires KNOWLEDGE_AGENT. The server binds the authenticated key; idempotent replay checks all original Spaces against the current key scope.
      parameters:
        - {$ref: '#/components/parameters/ChatIdempotencyKey'}
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Agent query accepted inside KNOWLEDGE_AGENT scope}
        '403': {$ref: '#/components/responses/Error'}
  /agent/sessions/{sessionId}/queries/{messageId}:
    get:
      operationId: getAgentQueryResult
      description: Fetch the current authorized result using sessionId and messageId from an Agent webhook notification. Agent notifications contain identifiers, status and an optional answerId; they no longer include answer content even when includeContent is enabled. The unversioned /api/open alias also supports this route.
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: messageId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {$ref: '#/components/responses/ChatQueryResult'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: ylk_*
  parameters:
    ChatIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  responses:
    ChatQueryResult:
      description: Current task status with protected answer content and citations. A successful task can have unavailable evidence; inspect verificationStatus separately.
      headers:
        Cache-Control:
          schema: {type: string, const: 'private, no-store'}
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {$ref: '#/components/schemas/KnowledgeChatMessage'}
              meta: {type: object}
    Error:
      description: Stable error envelope with code, message and traceId
  schemas:
    KnowledgeChatMessage:
      type: object
      properties:
        id: {type: integer, format: int64}
        sessionId: {type: integer, format: int64}
        role: {type: string, const: assistant}
        content: {type: string}
        citationsJson: {type: [string, 'null'], description: Serialized citation array after current authorization checks}
        answerId: {type: [string, 'null']}
        taskStatus: {type: string, enum: [QUEUED, RUNNING, SUCCESS, FAILED, CANCELED]}
        verificationStatus: {type: string, enum: [VERIFIED, PARTIAL, REFUSED, UNAVAILABLE, SERVER_RESULT, PENDING, FAILED, CANCELED]}
        errorMessage: {type: [string, 'null']}
