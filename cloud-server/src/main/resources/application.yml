server:
  port: 8080

spring:
  application:
    name: ylcloud
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

ylcloud:
  jwt:
    secret: ${YLCLOUD_JWT_SECRET}
    expiration-ms: ${YLCLOUD_JWT_EXPIRATION_MS:3600000}
  upload:
    max-file-size: 2147483648
  minio:
    endpoint: ${ylcloud.minio.endpoint}
    accessKey: ${ylcloud.minio.accessKey}
    secretKey: ${ylcloud.minio.secretKey}
    bucket-name: ${YLCLOUD_MINIO_BUCKET:localbucket1}
  rag:
    vector-enabled: true
    embedding-dimension: ${YLCLOUD_RAG_EMBEDDING_DIMENSION:512}
    vector-top-n: 30
    embedding-batch-size: 8
    connect-timeout-ms: 3000
    read-timeout-ms: 60000
    model-service:
      base-url: ${YLCLOUD_RAG_MODEL_SERVICE_BASE_URL:http://127.0.0.1:8001}
      embedding-model: ${YLCLOUD_RAG_EMBEDDING_MODEL:BAAI/bge-small-zh-v1.5}
      rerank-model: ${YLCLOUD_RAG_RERANK_MODEL:BAAI/bge-reranker-base}
      chat-model: ${YLCLOUD_LLM_MODEL:deepseek-chat}
    qdrant:
      init-enabled: true
      host: ${YLCLOUD_RAG_QDRANT_HOST:127.0.0.1}
      rest-port: ${YLCLOUD_RAG_QDRANT_REST_PORT:6333}
      port: ${YLCLOUD_RAG_QDRANT_PORT:6334}
      use-tls: ${YLCLOUD_RAG_QDRANT_USE_TLS:false}
      collection-name: ${YLCLOUD_RAG_QDRANT_COLLECTION_NAME:ylcloud_rag_bge_small_zh_v15}
      payload-text-key: text
      min-score: 0.0
    rerank:
      enabled: true
      top-k: 5
    chat:
      enabled: ${YLCLOUD_RAG_CHAT_ENABLED:true}
      max-context-chars: 12000
      max-chunk-chars: 1800
      max-answer-tokens: 1024
      temperature: 0.2
      no-answer-text: 当前知识库中没有检索到足够的依据，无法回答该问题。
      unavailable-text: 已检索到相关资料，但问答模型暂不可用。请先查看下方引用内容，稍后重试。
      system-prompt: 你是云端知识库问答助手。只能根据提供的知识库上下文回答；如果上下文没有答案，明确说明无法从当前知识库回答。回答应简洁、准确，并在相关句子后使用引用编号。
    extraction:
      enabled: true
      max-file-size: 52428800
      max-text-length: 500000
      fallback-to-metadata: true
      supported-extensions:
        - txt
        - md
        - markdown
        - pdf
        - doc
        - docx
  llm:
    enabled: ${YLCLOUD_LLM_ENABLED:true}
    provider: ${YLCLOUD_LLM_PROVIDER:openai-compatible}
    base-url: ${YLCLOUD_LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${YLCLOUD_LLM_API_KEY:}
    model: ${YLCLOUD_LLM_MODEL:deepseek-chat}
    connect-timeout-ms: ${YLCLOUD_LLM_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${YLCLOUD_LLM_READ_TIMEOUT_MS:60000}
    max-tokens: ${YLCLOUD_LLM_MAX_TOKENS:1024}
    temperature: ${YLCLOUD_LLM_TEMPERATURE:0.2}
