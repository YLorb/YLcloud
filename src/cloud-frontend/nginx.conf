server {
    listen 80;
    server_name _;
    client_max_body_size 2064m;
    # Only the explicitly configured TLS terminator may supply the client address.
    include /etc/nginx/trusted-proxy.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Docker service addresses can change when Gateway containers are recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # Keep preview resolution behind the same gateway authentication as other APIs.
    location /p/ {
        set $gateway_upstream gateway:8088;
        rewrite ^/p/(.*)$ /api/preview-links/$1 break;
        proxy_pass http://$gateway_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $gateway_upstream gateway:8088;
        proxy_pass http://$gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
