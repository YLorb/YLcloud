name: Build and publish to Docker Hub

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-backend:
    name: Verify backend and evaluation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      token-mysql:
        image: mysql:8.3
        env:
          MYSQL_ROOT_PASSWORD: token-test-local
          MYSQL_DATABASE: token_test
        ports: ["19306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Prepare isolated Token ledger schema using production migration
        run: |
          cat scripts/tests/token-metering-schema.sql src/cloud-server/src/main/resources/db/migration/V65__api_key_token_metering.sql | docker exec -i -e MYSQL_PWD=token-test-local '${{ job.services.token-mysql.id }}' mysql -uroot token_test
      - name: Java regression tests
        run: mvn -B -ntp -pl :cloud-server -am test
        env:
          YLCLOUD_TOKEN_MYSQL_TEST: 'true'
          YLCLOUD_TOKEN_TEST_DB_URL: 'jdbc:mysql://127.0.0.1:19306/token_test?useSSL=false&allowPublicKeyRetrieval=true'
          YLCLOUD_TOKEN_TEST_DB_USER: root
          YLCLOUD_TOKEN_TEST_DB_PASSWORD: token-test-local
      - name: Model usage and service authentication contracts
        run: |
          python3 -m pip install fastapi==0.139.0 httpx==0.28.1 jsonschema pytest
          cd src/model-service
          python3 -m pytest -q test_bge_auth_boundary.py test_bge_service.py test_service_auth.py test_secret_utils.py test_intent_plan.py
      - name: Evaluation metric contracts
        run: python3 scripts/test_trusted_answer_metrics.py
      - name: Gateway deployment and rollback contracts
        run: bash scripts/tests/deploy-sh-test.sh "$GITHUB_WORKSPACE"
      - name: Gateway Cookie configuration and Nginx DNS recovery
        run: python3 scripts/tests/gateway-edge-test.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: '**/target/surefire-reports/'

  verify-gateway:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.7-alpine
        ports: ["16379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
      mysql:
        image: mysql:8.3
        env:
          MYSQL_ROOT_PASSWORD: gateway-test-local
          MYSQL_DATABASE: gateway_session_test
        ports: ["19306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -f src/cloud-gateway/pom.xml verify
        env:
          GATEWAY_TEST_REDIS_PORT: '16379'
          GATEWAY_TEST_DB_URL: 'r2dbc:mysql://root:gateway-test-local@127.0.0.1:19306/gateway_session_test'

  verify-frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/cloud-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/cloud-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  build-images:
    needs: [verify-backend, verify-frontend, verify-gateway]
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ylcloud-app
            context: .
            dockerfile: ./src/cloud-server/Dockerfile

          - image: ylcloud-gateway
            context: ./src/cloud-gateway
            dockerfile: ./src/cloud-gateway/Dockerfile

          - image: ylcloud-frontend
            context: ./src/cloud-frontend
            dockerfile: ./src/cloud-frontend/Dockerfile

          - image: ylcloud-model-service
            context: ./src/model-service
            dockerfile: ./src/model-service/Dockerfile

          - image: ylcloud-document-parser-service
            context: ./src/document-parser-service
            dockerfile: ./src/document-parser-service/Dockerfile

          - image: ylcloud-workflow-service
            context: ./src/workflow-service
            dockerfile: ./src/workflow-service/Dockerfile

          - image: ylcloud-sandbox-service
            context: ./src/sandbox-service
            dockerfile: ./src/sandbox-service/Dockerfile

          - image: ylcloud-tool-file-preflight
            context: ./src/sandbox-tools/file-preflight
            dockerfile: ./src/sandbox-tools/file-preflight/Dockerfile

          - image: ylcloud-tool-json-echo
            context: ./src/sandbox-tools/json-echo
            dockerfile: ./src/sandbox-tools/json-echo/Dockerfile

    steps:
      - name: Validate publishing credentials
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Set repository variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN.'
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME || 'ylcloud-ci' }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
