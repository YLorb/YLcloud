services:
  mysql:
    image: mysql:8.3
    container_name: ylcloud-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ylcloud_root
      MYSQL_DATABASE: ylcloud
      MYSQL_USER: ylcloud
      MYSQL_PASSWORD: ylcloud_pwd
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./cloud-server/src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "ylcloud", "-pylcloud_pwd"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ylcloud-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ylcloud_minio
      MINIO_ROOT_PASSWORD: ylcloud_minio_pwd
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: ylcloud-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  model-service:
    build:
      context: ./model-service
    container_name: ylcloud-model-service
    environment:
      MODEL_CACHE_DIR: /models
      USE_FP16: "false"
      EMBEDDING_MODEL_NAME: ${YLCLOUD_RAG_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      RERANK_MODEL_NAME: ${YLCLOUD_RAG_RERANK_MODEL:-BAAI/bge-reranker-base}
      CHAT_MODEL_NAME: ${YLCLOUD_LLM_MODEL:-deepseek-chat}
      OPENAI_COMPATIBLE_BASE_URL: ${YLCLOUD_LLM_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${YLCLOUD_LLM_API_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - model-cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5

  ylcloud-app:
    image: eclipse-temurin:17-jre
    container_name: ylcloud-app
    profiles:
      - app
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      model-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ylcloud?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ylcloud
      SPRING_DATASOURCE_PASSWORD: ylcloud_pwd
      YLCLOUD_MINIO_ENDPOINT: http://minio:9000
      YLCLOUD_MINIO_ACCESS_KEY: ylcloud_minio
      YLCLOUD_MINIO_SECRET_KEY: ylcloud_minio_pwd
      YLCLOUD_MINIO_BUCKET: localbucket1
      YLCLOUD_RAG_MODEL_SERVICE_BASE_URL: http://model-service:8001
      YLCLOUD_RAG_EMBEDDING_DIMENSION: 512
      YLCLOUD_RAG_EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      YLCLOUD_RAG_RERANK_MODEL: BAAI/bge-reranker-base
      YLCLOUD_RAG_QDRANT_COLLECTION_NAME: ylcloud_rag_bge_small_zh_v15
      YLCLOUD_RAG_CHAT_ENABLED: "false"
      YLCLOUD_RAG_QDRANT_HOST: qdrant
      YLCLOUD_RAG_QDRANT_REST_PORT: 6333
      YLCLOUD_RAG_QDRANT_PORT: 6334
      YLCLOUD_LLM_ENABLED: ${YLCLOUD_LLM_ENABLED:-false}
      YLCLOUD_LLM_PROVIDER: ${YLCLOUD_LLM_PROVIDER:-disabled}
      YLCLOUD_LLM_BASE_URL: ${YLCLOUD_LLM_BASE_URL:-}
      YLCLOUD_LLM_API_KEY: ${YLCLOUD_LLM_API_KEY:-}
      YLCLOUD_LLM_MODEL: ${YLCLOUD_LLM_MODEL:-}
    ports:
      - "8080:8080"
    volumes:
      - ./cloud-server/target/cloud-server-1.0-SNAPSHOT.jar:/app/cloud-server.jar:ro
    command: ["java", "-jar", "/app/cloud-server.jar"]

volumes:
  mysql-data:
  minio-data:
  qdrant-data:
  model-cache:
