services:
  rabbitmq:
    image: rabbitmq:4.3.4-management
    container_name: ylcloud-rabbitmq
    restart: unless-stopped
    hostname: ylcloud-rabbitmq
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf 'default_user = %s\ndefault_pass = %s\ndefault_vhost = %s\n' \
          "$$YLCLOUD_RABBITMQ_BOOTSTRAP_USER" "$$(cat /run/secrets/rabbitmq_password)" \
          "$$YLCLOUD_RABBITMQ_BOOTSTRAP_VHOST" > /tmp/rabbitmq.conf
        chown rabbitmq:rabbitmq /tmp/rabbitmq.conf
        export RABBITMQ_CONFIG_FILE=/tmp/rabbitmq
        exec docker-entrypoint.sh rabbitmq-server
    secrets:
      - rabbitmq_password
    environment:
      YLCLOUD_RABBITMQ_BOOTSTRAP_USER: ${YLCLOUD_RABBITMQ_USERNAME:-ylcloud_app}
      YLCLOUD_RABBITMQ_BOOTSTRAP_VHOST: ${YLCLOUD_RABBITMQ_VHOST:-/ylcloud}
    ports:
      - "127.0.0.1:${YLCLOUD_RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${YLCLOUD_RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mysql:
    image: mysql:8.3
    container_name: ylcloud-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${YLCLOUD_MYSQL_ROOT_PASSWORD:-ylcloud_root}
      MYSQL_DATABASE: ${YLCLOUD_MYSQL_DATABASE:-ylcloud}
      MYSQL_USER: ${YLCLOUD_MYSQL_USER:-ylcloud}
      MYSQL_PASSWORD: ${YLCLOUD_MYSQL_PASSWORD:-ylcloud_pwd}
      TZ: Asia/Shanghai
    ports:
      - "${YLCLOUD_INFRA_BIND_ADDRESS:-127.0.0.1}:${YLCLOUD_MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ylcloud-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${YLCLOUD_MINIO_ACCESS_KEY:-ylcloud_minio}
      MINIO_ROOT_PASSWORD: ${YLCLOUD_MINIO_SECRET_KEY:-ylcloud_minio_pwd}
    ports:
      - "${YLCLOUD_INFRA_BIND_ADDRESS:-127.0.0.1}:${YLCLOUD_MINIO_API_HOST_PORT:-9000}:9000"
      - "${YLCLOUD_INFRA_BIND_ADDRESS:-127.0.0.1}:${YLCLOUD_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: ylcloud-qdrant
    restart: unless-stopped
    ports:
      - "${YLCLOUD_INFRA_BIND_ADDRESS:-127.0.0.1}:${YLCLOUD_QDRANT_REST_HOST_PORT:-6333}:6333"
      - "${YLCLOUD_INFRA_BIND_ADDRESS:-127.0.0.1}:${YLCLOUD_QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 12

  model-service:
    build:
      context: ./model-service
    image: ylcloud-model-service:local
    container_name: ylcloud-model-service
    restart: unless-stopped
    secrets:
      - service_jwt_active_secret
      - llm_api_key
      - ark_api_key
      - rag_query_api_key
    environment:
      MODEL_CACHE_DIR: /models
      MODEL_SERVICE_JWT_ACTIVE_SECRET_FILE: /run/secrets/service_jwt_active_secret
      USE_FP16: "false"
      OFFLINE_FALLBACK: ${YLCLOUD_MODEL_SERVICE_OFFLINE_FALLBACK:-true}
      FALLBACK_DIMENSION: ${YLCLOUD_RAG_EMBEDDING_DIMENSION:-512}
      EXPECTED_EMBEDDING_DIMENSION: ${YLCLOUD_RAG_EMBEDDING_DIMENSION:-512}
      EMBEDDING_MODEL_NAME: ${YLCLOUD_RAG_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      RERANK_MODEL_NAME: ${YLCLOUD_RAG_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      CHAT_MODEL_NAME: ${YLCLOUD_LLM_MODEL:-deepseek-chat}
      CHAT_BASE_URL: ${YLCLOUD_LLM_BASE_URL:-https://api.deepseek.com}
      CHAT_API_KEY_FILE: /run/secrets/llm_api_key
      CHAT_API_STYLE: ${YLCLOUD_LLM_CHAT_API_STYLE:-chat_completions}
      GENERATE_MODEL_NAME: ${YLCLOUD_RAG_QUERY_MODEL:-${YLCLOUD_ARK_MODEL:-doubao-seed-2-0-pro-260215}}
      GENERATE_BASE_URL: ${YLCLOUD_RAG_QUERY_BASE_URL:-${YLCLOUD_ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}}
      GENERATE_API_KEY_FILE: /run/secrets/rag_query_api_key
      GENERATE_API_STYLE: ${YLCLOUD_RAG_QUERY_API_STYLE:-responses}
      OPENAI_COMPATIBLE_BASE_URL: ${YLCLOUD_ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      OPENAI_COMPATIBLE_API_KEY_FILE: /run/secrets/ark_api_key
      LLM_API_STYLE: ${YLCLOUD_LLM_API_STYLE:-responses}
    ports:
      - "${YLCLOUD_INFRA_BIND_ADDRESS:-127.0.0.1}:${YLCLOUD_MODEL_HOST_PORT:-8001}:8001"
    volumes:
      - model-cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=30).read()"]
      interval: 30s
      timeout: 35s
      start_period: 60s
      retries: 5

  document-parser-service:
    build:
      context: ./document-parser-service
    image: ylcloud-document-parser-service:local
    container_name: ylcloud-document-parser-service
    restart: unless-stopped
    secrets:
      - ark_api_key
      - vlm_api_key
    environment:
      OCR_LANG: ${YLCLOUD_RAG_OCR_LANG:-chi_sim+eng}
      OPENAI_COMPATIBLE_BASE_URL: ${YLCLOUD_ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      OPENAI_COMPATIBLE_API_KEY_FILE: /run/secrets/ark_api_key
      CHAT_MODEL_NAME: ${YLCLOUD_ARK_MODEL:-doubao-seed-2-0-pro-260215}
      VLM_BASE_URL: ${YLCLOUD_VLM_BASE_URL:-${YLCLOUD_ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}}
      VLM_API_KEY_FILE: /run/secrets/vlm_api_key
      VLM_MODEL: ${YLCLOUD_VLM_MODEL:-${YLCLOUD_ARK_MODEL:-doubao-seed-2-0-pro-260215}}
      VLM_API_STYLE: ${YLCLOUD_VLM_API_STYLE:-responses}
    ports:
      - "${YLCLOUD_INFRA_BIND_ADDRESS:-127.0.0.1}:${YLCLOUD_PARSER_HOST_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5

  ylcloud-app:
    build:
      context: .
      dockerfile: cloud-server/Dockerfile
    image: ylcloud-app:local
    container_name: ylcloud-app
    restart: unless-stopped
    secrets:
      - jwt_secret
      - service_jwt_active_secret
      - llm_api_key
      - ark_api_key
      - rag_query_api_key
      - vlm_api_key
      - rabbitmq_password
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      model-service:
        condition: service_healthy
      document-parser-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${YLCLOUD_SPRING_PROFILE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${YLCLOUD_MYSQL_DATABASE:-ylcloud}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${YLCLOUD_MYSQL_USER:-ylcloud}
      SPRING_DATASOURCE_PASSWORD: ${YLCLOUD_MYSQL_PASSWORD:-ylcloud_pwd}
      YLCLOUD_JWT_SECRET_FILE: /run/secrets/jwt_secret
      YLCLOUD_SERVICE_JWT_ACTIVE_SECRET_FILE: /run/secrets/service_jwt_active_secret
      YLCLOUD_LLM_API_KEY_FILE: /run/secrets/llm_api_key
      YLCLOUD_ARK_API_KEY_FILE: /run/secrets/ark_api_key
      YLCLOUD_RAG_QUERY_API_KEY_FILE: /run/secrets/rag_query_api_key
      YLCLOUD_VLM_API_KEY_FILE: /run/secrets/vlm_api_key
      YLCLOUD_RABBITMQ_HOST: rabbitmq
      YLCLOUD_RABBITMQ_PORT: 5672
      YLCLOUD_RABBITMQ_VHOST: ${YLCLOUD_RABBITMQ_VHOST:-/ylcloud}
      YLCLOUD_RABBITMQ_USERNAME: ${YLCLOUD_RABBITMQ_USERNAME:-ylcloud_app}
      YLCLOUD_RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      YLCLOUD_ASYNC_MQ_ENABLED: ${YLCLOUD_ASYNC_MQ_ENABLED:-true}
      YLCLOUD_ASYNC_MQ_CLEANUP: ${YLCLOUD_ASYNC_MQ_CLEANUP:-false}
      YLCLOUD_ASYNC_MQ_MAINTENANCE: ${YLCLOUD_ASYNC_MQ_MAINTENANCE:-false}
      YLCLOUD_ASYNC_MQ_MEMORY: ${YLCLOUD_ASYNC_MQ_MEMORY:-false}
      YLCLOUD_MINIO_ENDPOINT: http://minio:9000
      YLCLOUD_MINIO_ACCESS_KEY: ${YLCLOUD_MINIO_ACCESS_KEY:-ylcloud_minio}
      YLCLOUD_MINIO_SECRET_KEY: ${YLCLOUD_MINIO_SECRET_KEY:-ylcloud_minio_pwd}
      YLCLOUD_MINIO_BUCKET: ${YLCLOUD_MINIO_BUCKET:-localbucket1}
      YLCLOUD_MINIO_INIT_ENABLED: "true"
      YLCLOUD_MINIO_VERSIONING_ENABLED: "true"
      YLCLOUD_RAG_MODEL_SERVICE_BASE_URL: http://model-service:8001
      YLCLOUD_RAG_PARSER_SERVICE_BASE_URL: http://document-parser-service:8002
      YLCLOUD_RAG_EMBEDDING_DIMENSION: 512
      YLCLOUD_RAG_EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      YLCLOUD_RAG_RERANK_MODEL: BAAI/bge-reranker-v2-m3
      YLCLOUD_RAG_QDRANT_COLLECTION_NAME: ylcloud_rag_bge_small_zh_v15
      YLCLOUD_RAG_CHAT_ENABLED: "true"
      YLCLOUD_RAG_QDRANT_HOST: qdrant
      YLCLOUD_RAG_QDRANT_REST_PORT: 6333
      YLCLOUD_RAG_QDRANT_PORT: 6334
      YLCLOUD_LLM_ENABLED: ${YLCLOUD_LLM_ENABLED:-true}
      YLCLOUD_LLM_PROVIDER: ${YLCLOUD_LLM_PROVIDER:-deepseek}
      YLCLOUD_LLM_BASE_URL: ${YLCLOUD_LLM_BASE_URL:-https://api.deepseek.com}
      YLCLOUD_LLM_MODEL: ${YLCLOUD_LLM_MODEL:-deepseek-chat}
      YLCLOUD_ARK_BASE_URL: ${YLCLOUD_ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      YLCLOUD_ARK_MODEL: ${YLCLOUD_ARK_MODEL:-doubao-seed-2-0-pro-260215}
      YLCLOUD_RAG_QUERY_MODEL: ${YLCLOUD_RAG_QUERY_MODEL:-${YLCLOUD_ARK_MODEL:-doubao-seed-2-0-pro-260215}}
      YLCLOUD_RAG_INDEX_CONCURRENCY: ${YLCLOUD_RAG_INDEX_CONCURRENCY:-5}
      YLCLOUD_RAG_INDEX_TASK_TIMEOUT_MINUTES: ${YLCLOUD_RAG_INDEX_TASK_TIMEOUT_MINUTES:-10}
    ports:
      - "${YLCLOUD_INFRA_BIND_ADDRESS:-127.0.0.1}:${YLCLOUD_BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/site/public-settings"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  frontend:
    build:
      context: ./cloud-frontend
    image: ylcloud-frontend:local
    container_name: ylcloud-frontend
    restart: unless-stopped
    depends_on:
      ylcloud-app:
        condition: service_healthy
    ports:
      - "${YLCLOUD_PUBLIC_BIND_ADDRESS:-0.0.0.0}:${YLCLOUD_FRONTEND_HOST_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql-data:
  minio-data:
  qdrant-data:
  model-cache:
  rabbitmq-data:

secrets:
  rabbitmq_password:
    file: ./.secrets/rabbitmq_password
  jwt_secret:
    file: ./.secrets/jwt_secret
  service_jwt_active_secret:
    file: ./.secrets/service_jwt_active_secret
  llm_api_key:
    file: ./.secrets/llm_api_key
  ark_api_key:
    file: ./.secrets/ark_api_key
  rag_query_api_key:
    file: ./.secrets/rag_query_api_key
  vlm_api_key:
    file: ./.secrets/vlm_api_key
