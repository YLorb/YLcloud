server:
  port: 8080

spring:
  application:
    name: ylcloud
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  rabbitmq:
    host: ${YLCLOUD_RABBITMQ_HOST:127.0.0.1}
    port: ${YLCLOUD_RABBITMQ_PORT:5672}
    virtual-host: ${YLCLOUD_RABBITMQ_VHOST:/ylcloud}
    username: ${YLCLOUD_RABBITMQ_USERNAME:ylcloud_app}
    password: ${YLCLOUD_RABBITMQ_PASSWORD:ylcloud_rabbit_local}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${YLCLOUD_ASYNC_MQ_PREFETCH:1}
        default-requeue-rejected: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

ylcloud:
  knowledge:
    quality:
      auto-activate-threshold: ${YLCLOUD_KNOWLEDGE_AUTO_ACTIVATE_THRESHOLD:75}
  async:
    mq:
      enabled: ${YLCLOUD_ASYNC_MQ_ENABLED:false}
      cleanup: ${YLCLOUD_ASYNC_MQ_CLEANUP:false}
      maintenance: ${YLCLOUD_ASYNC_MQ_MAINTENANCE:false}
      publisher-delay-ms: ${YLCLOUD_ASYNC_MQ_PUBLISHER_DELAY_MS:1000}
      publisher-batch-size: ${YLCLOUD_ASYNC_MQ_PUBLISHER_BATCH_SIZE:50}
      publish-lease-seconds: ${YLCLOUD_ASYNC_MQ_PUBLISH_LEASE_SECONDS:30}
      retry-seconds: ${YLCLOUD_ASYNC_MQ_RETRY_SECONDS:60}
      max-attempts: ${YLCLOUD_ASYNC_MQ_MAX_ATTEMPTS:4}
      lease-seconds: ${YLCLOUD_ASYNC_MQ_LEASE_SECONDS:120}
      heartbeat-seconds: ${YLCLOUD_ASYNC_MQ_HEARTBEAT_SECONDS:30}
      retention-days: ${YLCLOUD_ASYNC_MQ_RETENTION_DAYS:3}
      retry-queue-ttl-ms: ${YLCLOUD_ASYNC_MQ_RETRY_QUEUE_TTL_MS:60000}
      cleanup-concurrency: ${YLCLOUD_ASYNC_MQ_CLEANUP_CONCURRENCY:1}
      maintenance-concurrency: ${YLCLOUD_ASYNC_MQ_MAINTENANCE_CONCURRENCY:1}
      memory-concurrency: ${YLCLOUD_ASYNC_MQ_MEMORY_CONCURRENCY:2}
      chat-concurrency: ${YLCLOUD_ASYNC_MQ_CHAT_CONCURRENCY:3}
      knowledge-concurrency: ${YLCLOUD_ASYNC_MQ_KNOWLEDGE_CONCURRENCY:2}
      rag-concurrency: ${YLCLOUD_ASYNC_MQ_RAG_CONCURRENCY:2}
  workflow:
    client:
      enabled: ${YLCLOUD_WORKFLOW_ENABLED:false}
      base-url: ${YLCLOUD_WORKFLOW_BASE_URL:http://127.0.0.1:8003}
      connect-timeout-ms: ${YLCLOUD_WORKFLOW_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${YLCLOUD_WORKFLOW_READ_TIMEOUT_MS:5000}
      max-connections: ${YLCLOUD_WORKFLOW_MAX_CONNECTIONS:32}
      max-connections-per-route: ${YLCLOUD_WORKFLOW_MAX_CONNECTIONS_PER_ROUTE:16}
      retry-backoff-ms: ${YLCLOUD_WORKFLOW_RETRY_BACKOFF_MS:50}
      max-response-bytes: ${YLCLOUD_WORKFLOW_MAX_RESPONSE_BYTES:2097152}
  cross-store:
    lease-seconds: 3600
    recovery-delay-ms: 60000
    recovery-initial-delay-ms: 60000
  jwt:
    secret: ${YLCLOUD_JWT_SECRET}
    expiration-ms: ${YLCLOUD_JWT_EXPIRATION_MS:3600000}
  service-jwt:
    active-secret: ${YLCLOUD_SERVICE_JWT_ACTIVE_SECRET}
    previous-secret: ${YLCLOUD_SERVICE_JWT_PREVIOUS_SECRET:}
    previous-valid-until-epoch-seconds: ${YLCLOUD_SERVICE_JWT_PREVIOUS_VALID_UNTIL_EPOCH_SECONDS:0}
    issuer: ylcloud-app
    subject: ylcloud-app
    workflow-issuer: ylcloud-workflow
    workflow-subject: ylcloud-workflow
    max-ttl-seconds: ${YLCLOUD_SERVICE_JWT_MAX_TTL_SECONDS:300}
    clock-skew-seconds: ${YLCLOUD_SERVICE_JWT_CLOCK_SKEW_SECONDS:30}
  upload:
    max-file-size: 2147483648
    multipart-threshold-bytes: ${YLCLOUD_UPLOAD_MULTIPART_THRESHOLD_BYTES:20971520}
    chunk-lease-seconds: ${YLCLOUD_UPLOAD_CHUNK_LEASE_SECONDS:3600}
    merge-lease-seconds: ${YLCLOUD_UPLOAD_MERGE_LEASE_SECONDS:600}
    multipart-retention-hours: ${YLCLOUD_UPLOAD_MULTIPART_RETENTION_HOURS:24}
    multipart-cleanup-delay-ms: ${YLCLOUD_UPLOAD_MULTIPART_CLEANUP_DELAY_MS:3600000}
  minio:
    endpoint: ${YLCLOUD_MINIO_ENDPOINT:http://127.0.0.1:9000}
    accessKey: ${YLCLOUD_MINIO_ACCESS_KEY:ylcloud_minio}
    secretKey: ${YLCLOUD_MINIO_SECRET_KEY:ylcloud_minio_pwd}
    bucket-name: ${YLCLOUD_MINIO_BUCKET:localbucket1}
    init-enabled: ${YLCLOUD_MINIO_INIT_ENABLED:true}
    versioning-enabled: ${YLCLOUD_MINIO_VERSIONING_ENABLED:true}
  rag:
    vector-enabled: true
    embedding-dimension: ${YLCLOUD_RAG_EMBEDDING_DIMENSION:512}
    vector-top-n: 20
    embedding-batch-size: 8
    connect-timeout-ms: 3000
    read-timeout-ms: 60000
    model-service:
      base-url: ${YLCLOUD_RAG_MODEL_SERVICE_BASE_URL:http://127.0.0.1:8001}
      embedding-model: ${YLCLOUD_RAG_EMBEDDING_MODEL:BAAI/bge-small-zh-v1.5}
      rerank-model: ${YLCLOUD_RAG_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
      chat-model: ${YLCLOUD_LLM_MODEL:deepseek-chat}
    qdrant:
      init-enabled: true
      host: ${YLCLOUD_RAG_QDRANT_HOST:127.0.0.1}
      rest-port: ${YLCLOUD_RAG_QDRANT_REST_PORT:6333}
      port: ${YLCLOUD_RAG_QDRANT_PORT:6334}
      use-tls: ${YLCLOUD_RAG_QDRANT_USE_TLS:false}
      collection-name: ${YLCLOUD_RAG_QDRANT_COLLECTION_NAME:ylcloud_rag_bge_small_zh_v15}
      memory-collection-name: ${YLCLOUD_MEMORY_QDRANT_COLLECTION_NAME:ylcloud_user_memory_bge_small_zh_v15}
      payload-text-key: text
      min-score: 0.0
    memory:
      enabled: ${YLCLOUD_MEMORY_ENABLED:true}
      candidate-top-k: ${YLCLOUD_MEMORY_CANDIDATE_TOP_K:12}
      top-k: ${YLCLOUD_MEMORY_TOP_K:5}
      max-tokens: ${YLCLOUD_MEMORY_MAX_TOKENS:512}
      retention-days: ${YLCLOUD_MEMORY_RETENTION_DAYS:0}
      min-score: ${YLCLOUD_MEMORY_MIN_SCORE:0.25}
      max-retries: ${YLCLOUD_MEMORY_MAX_RETRIES:8}
    rerank:
      enabled: ${YLCLOUD_RAG_RERANK_ENABLED:true}
      candidate-top-k: ${YLCLOUD_RAG_RERANK_CANDIDATE_TOP_K:5}
      top-k: ${YLCLOUD_RAG_RERANK_TOP_K:5}
    query:
      rewrite-enabled: ${YLCLOUD_RAG_QUERY_REWRITE_ENABLED:true}
      model-rewrite-enabled: ${YLCLOUD_RAG_QUERY_MODEL_REWRITE_ENABLED:true}
      multi-query-enabled: ${YLCLOUD_RAG_MULTI_QUERY_ENABLED:true}
      hyde-enabled: ${YLCLOUD_RAG_HYDE_ENABLED:true}
      step-back-enabled: ${YLCLOUD_RAG_STEP_BACK_ENABLED:true}
      max-expanded-queries: ${YLCLOUD_RAG_MAX_EXPANDED_QUERIES:4}
      model: ${YLCLOUD_RAG_QUERY_MODEL:${YLCLOUD_ARK_MODEL:doubao-seed-2-0-pro-260215}}
    retrieval:
      dense-weight: 0.45
      bm25-weight: 0.30
      keyword-weight: 0.25
      metadata-weight: 0.12
      title-weight: 0.10
      structure-weight: 0.05
      hyde-weight: 0.20
      step-back-weight: 0.18
      query-expansion-weight: 0.70
      neighbor-window: 1
      rrf-k: ${YLCLOUD_RAG_RRF_K:60}
      vector-top-k: ${YLCLOUD_RAG_VECTOR_TOP_K:20}
      bm25-top-k: ${YLCLOUD_RAG_BM25_TOP_K:20}
      multi-query-top-k: ${YLCLOUD_RAG_MULTI_QUERY_TOP_K:20}
      hyde-top-k: ${YLCLOUD_RAG_HYDE_TOP_K:20}
      step-back-top-k: ${YLCLOUD_RAG_STEP_BACK_TOP_K:20}
      keyword-fallback-top-k: ${YLCLOUD_RAG_KEYWORD_FALLBACK_TOP_K:20}
      tokenizer-provider: ${YLCLOUD_RAG_TOKENIZER_PROVIDER:ik}
      exact-match-boost: ${YLCLOUD_RAG_EXACT_MATCH_BOOST:1.5}
      bm25-k1: ${YLCLOUD_RAG_BM25_K1:1.5}
      bm25-b: ${YLCLOUD_RAG_BM25_B:0.75}
    chunking:
      strategy: hybrid
      semantic-enabled: true
      semantic-window-chars: 260
      semantic-break-threshold: 0.28
      keep-code-blocks: true
    chat:
      enabled: ${YLCLOUD_RAG_CHAT_ENABLED:true}
      max-context-chars: 12000
      max-chunk-chars: 1800
      max-answer-tokens: 1024
      max-history-tokens: ${YLCLOUD_CHAT_MAX_HISTORY_TOKENS:2048}
      summary-max-tokens: ${YLCLOUD_CHAT_SUMMARY_MAX_TOKENS:512}
      temperature: 0.2
      no-answer-text: 当前知识库中没有检索到足够的依据，无法回答该问题。
      unavailable-text: 已检索到相关资料，但问答模型暂不可用。请先查看下方引用内容，稍后重试。
      system-prompt: 你是云端知识库问答助手。只能根据提供的知识库上下文回答；如果上下文没有答案，明确说明无法从当前知识库回答。回答应简洁、准确，并在相关句子后使用引用编号。若用户询问代码、写法、模板、示例实现，必须优先完整输出上下文中命中的相关代码，使用 fenced code block 包裹；不要用“见上下文”“部分代码如下”等方式省略已检索到的代码。
    index:
      concurrency: ${YLCLOUD_RAG_INDEX_CONCURRENCY:5}
      task-timeout-minutes: ${YLCLOUD_RAG_INDEX_TASK_TIMEOUT_MINUTES:10}
    extraction:
      enabled: true
      structured-enabled: true
      layout-enabled: true
      ocr-enabled: true
      vlm-enabled: true
      parser-version: structured-v3
      parser-service-base-url: ${YLCLOUD_RAG_PARSER_SERVICE_BASE_URL:http://127.0.0.1:8002}
      min-text-chars-before-ocr: 300
      min-ocr-confidence-before-vlm: 0.75
      max-vlm-pages: 20
      max-ocr-pages: 100
      parser-object-url-ttl-seconds: 300
      preserve-table-markdown: true
      max-file-size: 52428800
      max-text-length: 500000
      fallback-to-metadata: true
      supported-extensions:
        - txt
        - md
        - markdown
        - log
        - csv
        - json
        - xml
        - yaml
        - yml
        - properties
        - java
        - js
        - ts
        - jsx
        - tsx
        - py
        - go
        - rs
        - c
        - h
        - cpp
        - hpp
        - cs
        - php
        - rb
        - sh
        - sql
        - html
        - css
        - pdf
        - doc
        - docx
        - ppt
        - pptx
  llm:
    enabled: ${YLCLOUD_LLM_ENABLED:true}
    provider: ${YLCLOUD_LLM_PROVIDER:deepseek}
    base-url: ${YLCLOUD_LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${YLCLOUD_LLM_API_KEY:}
    model: ${YLCLOUD_LLM_MODEL:deepseek-chat}
    connect-timeout-ms: ${YLCLOUD_LLM_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${YLCLOUD_LLM_READ_TIMEOUT_MS:60000}
    max-tokens: ${YLCLOUD_LLM_MAX_TOKENS:1024}
    temperature: ${YLCLOUD_LLM_TEMPERATURE:0.2}
