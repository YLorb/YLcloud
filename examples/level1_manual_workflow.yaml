version: "1.0"
name: research_summarizer
description: 总结 AI Agent 工作流系统的核心组成。
inputs:
  goal: 总结 AI Agent 工作流系统的核心组成
nodes:
  - id: start
    type: start
    next: plan
  - id: plan
    type: llm
    prompt: "请为这个目标生成 3 个搜索关键词：{{ goal }}"
    output: keywords
    next: search
  - id: search
    type: tool
    tool: mock_search
    input: "{{ keywords }}"
    output: search_results
    next: summarize
  - id: summarize
    type: llm
    prompt: "请总结这些资料：{{ search_results }}"
    output: final_answer
    next: end
  - id: end
    type: end
