[project]
name = "mini-agent-flow"
version = "0.1.0"
description = "A mini Agent workflow builder for learning workflow engines, tool calling, and planner-executor patterns."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mini_agent_flow*"]
exclude = ["schemas*", "examples*", "tests*"]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.22.0",
    "pytest>=8.0.0",
]

[project.scripts]
mini-agent-flow = "mini_agent_flow.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
