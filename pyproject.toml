[project]
name = "mini-agent-flow"
version = "0.1.0"
description = "A mini Agent workflow builder for learning workflow engines, tool calling, and planner-executor patterns."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "jinja2>=3.1.0",
    "networkx>=3.2.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pymysql>=1.1.1,<2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mini_agent_flow*"]
exclude = ["schemas*", "examples*", "tests*"]

[tool.setuptools.package-data]
"mini_agent_flow.persistence" = ["sql/*.sql", "mysql_sql/*.sql"]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "jsonschema>=4.22.0",
    "pytest>=8.0.0",
]

[project.scripts]
mini-agent-flow = "mini_agent_flow.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
