name: Mirror third-party images to Alibaba Cloud ACR

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/acr-mirror.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acr-third-party-image-mirror
  cancel-in-progress: false

jobs:
  mirror-images:
    name: Mirror ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MinIO
            source: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
            repository: minio
            tag: RELEASE.2025-04-22T22-12-26Z

          - name: MySQL
            source: docker.io/library/mysql:8.3
            repository: mysql
            tag: "8.3"

          - name: Qdrant
            source: docker.io/qdrant/qdrant:v1.15.4
            repository: qdrant
            tag: v1.15.4

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Copy image to ACR
        run: |
          docker buildx imagetools create \
            --tag "${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ matrix.repository }}:${{ matrix.tag }}" \
            "${{ matrix.source }}"

      - name: Verify mirrored image
        run: |
          docker buildx imagetools inspect \
            "${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ matrix.repository }}:${{ matrix.tag }}"
